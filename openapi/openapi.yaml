components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
    refresh: {type: apiKey, in: header, name: X-Refresh-Token, description: 'App sends refresh token in body/header; CMS uses httpOnly cookie wh_rt'}
  schemas:
    Envelope:
      type: object
      properties:
        data: {}
        meta:
          type: object
          properties:
            nextCursor: {type: [string, 'null']}
            version: {type: integer}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, traceId]
          properties:
            code: {type: string, example: PREMIUM_REQUIRED}
            message: {type: string}
            details: {}
            traceId: {type: string}
