openapi: 3.1.0
info:
  title: WeHum API
  version: 1.0.0
  description: Generated outline — the NestJS app generates the full spec from DTOs (@nestjs/swagger) at /docs; keep this file in sync in CI.
servers:
  - url: https://api.wehum.app
  - url: https://api.staging.wehum.app
  - url: http://localhost:3000
security:
  - bearer: []
paths:
  /v1/auth/guest:
    post:
      operationId: post_v1_auth_guest
      tags: ["Auth"]
      summary: "Create or resume a guest user for this install"
      description: "Auth: public. body {installId, platform, appVersion, timezone, locale, attestation?}; returns tokens + me. Idempotent per installId"
      security: []
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/auth/refresh:
    post:
      operationId: post_v1_auth_refresh
      tags: ["Auth"]
      summary: "Rotate refresh token \u2192 new access + refresh"
      description: "Auth: refresh. reuse of a used token revokes the whole family (401 TOKEN_REUSED)"
      security: [{refresh: []}]
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/auth/logout:
    post:
      operationId: post_v1_auth_logout
      tags: ["Auth"]
      summary: "Revoke this device's refresh family + push token"
      description: "Auth: device."
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/auth/apple:
    post:
      operationId: post_v1_auth_apple
      tags: ["Auth"]
      summary: "Sign in with Apple (id token + nonce)"
      description: "Auth: public. returns tokens; body may carry guestMergeToken"
      security: []
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/auth/google:
    post:
      operationId: post_v1_auth_google
      tags: ["Auth"]
      summary: "Sign in with Google (id token)"
      description: "Auth: public."
      security: []
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/auth/email/login:
    post:
      operationId: post_v1_auth_email_login
      tags: ["Auth"]
      summary: "Email + password login"
      description: "Auth: public. 5 fails / 15 min / account+IP \u2192 429"
      security: []
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/auth/email/magic-link:
    post:
      operationId: post_v1_auth_email_magic_link
      tags: ["Auth"]
      summary: "Send sign-in link"
      description: "Auth: public. always 202 (no account enumeration); 60 s resend cooldown"
      security: []
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/auth/email/verify-link:
    post:
      operationId: post_v1_auth_email_verify_link
      tags: ["Auth"]
      summary: "Exchange magic-link token for tokens"
      description: "Auth: public. token single-use, 15 min"
      security: []
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/auth/password/forgot:
    post:
      operationId: post_v1_auth_password_forgot
      tags: ["Auth"]
      summary: "Send reset email"
      description: "Auth: public. always 202"
      security: []
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/auth/password/reset:
    post:
      operationId: post_v1_auth_password_reset
      tags: ["Auth"]
      summary: "Set new password with reset token"
      description: "Auth: public. revokes all refresh families"
      security: []
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/auth/link/apple:
    post:
      operationId: post_v1_auth_link_apple
      tags: ["Auth"]
      summary: "Attach Apple identity to current (guest) user"
      description: "Auth: device. 409 ACCOUNT_EXISTS {mergeToken} if identity belongs to another user"
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/auth/link/google:
    post:
      operationId: post_v1_auth_link_google
      tags: ["Auth"]
      summary: "Attach Google identity to current user"
      description: "Auth: device. same conflict rule"
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/auth/link/email:
    post:
      operationId: post_v1_auth_link_email
      tags: ["Auth"]
      summary: "Attach email + password to current user"
      description: "Auth: device. sends verify email"
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/auth/merge:
    post:
      operationId: post_v1_auth_merge
      tags: ["Auth"]
      summary: "Merge a guest's data into the signed-in account"
      description: "Auth: account. body {mergeToken}; moves meditations, recipes, program progress, stats; deletes guest"
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/bootstrap:
    get:
      operationId: get_v1_bootstrap
      tags: ["Bootstrap"]
      summary: "One call on launch: me, entitlement, config, flags, min versions, catalog version, founding offer, server time"
      description: "Auth: device. ETag; p95 < 60 ms (Redis)"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/time:
    get:
      operationId: get_v1_time
      tags: ["Bootstrap"]
      summary: "Server time (ms) for countdown sync"
      description: "Auth: public. also via socket time:sync"
      security: []
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/me:
    get:
      operationId: get_v1_me
      tags: ["Me"]
      summary: "Current user + entitlement + settings"
      description: "Auth: device."
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    patch:
      operationId: patch_v1_me
      tags: ["Me"]
      summary: "Update profile/settings"
      description: "Auth: device. firstName, timezone, locale, country, theme, reminderEnabled, reminderTime, groupWarning, dailyMessagePush, showCountry"
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      operationId: delete_v1_me
      tags: ["Me"]
      summary: "Delete account and all data"
      description: "Auth: device. account users need recent auth (< 5 min) or password; returns job id"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/me/progress:
    get:
      operationId: get_v1_me_progress
      tags: ["Me"]
      summary: "Progress for period=week|month|year|all"
      description: "Auth: device. minutes, meditations, together, average, daysThisWeek[7], bars[]; no streaks"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/me/entitlement/sync:
    post:
      operationId: post_v1_me_entitlement_sync
      tags: ["Me"]
      summary: "Force re-read of RevenueCat subscriber"
      description: "Auth: device. use after purchase if webhook not arrived yet"
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/me/devices:
    post:
      operationId: post_v1_me_devices
      tags: ["Me"]
      summary: "Register / update device + push token"
      description: "Auth: device."
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/me/devices/{id}:
    delete:
      operationId: delete_v1_me_devices_id
      tags: ["Me"]
      summary: "Remove device push token"
      description: "Auth: device."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/me/inbox:
    get:
      operationId: get_v1_me_inbox
      tags: ["Me"]
      summary: "Notification inbox (cursor)"
      description: "Auth: device."
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/me/inbox/read:
    post:
      operationId: post_v1_me_inbox_read
      tags: ["Me"]
      summary: "Mark items read"
      description: "Auth: device. body {ids[] | all:true}"
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/me/export:
    post:
      operationId: post_v1_me_export
      tags: ["Me"]
      summary: "Request data export (job \u2192 email link)"
      description: "Auth: account. 1 per 24 h"
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/analytics/events:
    post:
      operationId: post_v1_analytics_events
      tags: ["Me"]
      summary: "Batch product analytics events (\u2264 50)"
      description: "Auth: device. fire-and-forget, 202"
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/catalog:
    get:
      operationId: get_v1_catalog
      tags: ["Catalog"]
      summary: "Full catalog snapshot (themes, teachers, sessions, programs, sound blocks, SoS)"
      description: "Auth: device. ?version= \u2192 304 if unchanged; CDN-cached 5 min, ETag; ~150 KB gz"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/sessions/{id}:
    get:
      operationId: get_v1_sessions_id
      tags: ["Catalog"]
      summary: "Session detail + practicedToday + dedication preview"
      description: "Auth: device."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/programs/{id}:
    get:
      operationId: get_v1_programs_id
      tags: ["Catalog"]
      summary: "Program detail + my progress"
      description: "Auth: device."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/teachers/{id}:
    get:
      operationId: get_v1_teachers_id
      tags: ["Catalog"]
      summary: "Teacher bio + sessions"
      description: "Auth: device."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/sos:
    get:
      operationId: get_v1_sos
      tags: ["Catalog"]
      summary: "SoS screen: title, subtitle, tiles, help card"
      description: "Auth: device."
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/search:
    get:
      operationId: get_v1_search
      tags: ["Catalog"]
      summary: "Server search fallback (q, filters)"
      description: "Auth: device. app searches local catalog first; trigram index"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/today:
    get:
      operationId: get_v1_today
      tags: ["Today"]
      summary: "Today payload for user's local date"
      description: "Auth: device. MOTD + variants + live snapshot + group + freePick + program + progress card + daily message line; Redis 30 s per (date, plan)"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/motd/{date}:
    get:
      operationId: get_v1_motd_date
      tags: ["Today"]
      summary: "MOTD for a date"
      description: "Auth: device."
      parameters:
        - {name: date, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/group/next:
    get:
      operationId: get_v1_group_next
      tags: ["Today"]
      summary: "Next group meditation (startsAt UTC, length, lobby count)"
      description: "Auth: device."
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/live:
    get:
      operationId: get_v1_live
      tags: ["Today"]
      summary: "Live snapshot fallback when socket is down"
      description: "Auth: device. total, countries, vibration, quiet flag"
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/daily-messages/{date}:
    get:
      operationId: get_v1_daily_messages_date
      tags: ["Today"]
      summary: "Daily message (falls back to latest earlier)"
      description: "Auth: member."
      parameters:
        - {name: date, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/daily-messages:
    get:
      operationId: get_v1_daily_messages
      tags: ["Today"]
      summary: "Archive (q, theme, cursor)"
      description: "Auth: member."
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/media/play-url:
    post:
      operationId: post_v1_media_play_url
      tags: ["Media"]
      summary: "Signed CDN URL(s) for a session/variant/block"
      description: "Auth: device. premium content \u2192 403 PREMIUM_REQUIRED; URL valid 6 h (download: 7 d)"
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/meditations:
    post:
      operationId: post_v1_meditations
      tags: ["Meditations"]
      summary: "Record a meditation (client UUID v7 id)"
      description: "Auth: device. idempotent by id; server computes counted/localDate; updates stats async"
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    get:
      operationId: get_v1_meditations
      tags: ["Meditations"]
      summary: "My history (cursor)"
      description: "Auth: device."
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/meditations/batch:
    post:
      operationId: post_v1_meditations_batch
      tags: ["Meditations"]
      summary: "Offline sync (\u2264 100)"
      description: "Auth: device. per-item result"
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/recipes:
    get:
      operationId: get_v1_recipes
      tags: ["Recipes"]
      summary: "My saved meditations (Build your own)"
      description: "Auth: member."
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    post:
      operationId: post_v1_recipes
      tags: ["Recipes"]
      summary: "Save recipe"
      description: "Auth: member."
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/recipes/{id}:
    patch:
      operationId: patch_v1_recipes_id
      tags: ["Recipes"]
      summary: "Rename / edit recipe"
      description: "Auth: member."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      operationId: delete_v1_recipes_id
      tags: ["Recipes"]
      summary: "Delete recipe"
      description: "Auth: member."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/recipes/{id}/share:
    post:
      operationId: post_v1_recipes_id_share
      tags: ["Recipes"]
      summary: "Create share slug \u2192 wehum.app/r/{slug}"
      description: "Auth: member."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
        default: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/recipes/shared/{slug}:
    get:
      operationId: get_v1_recipes_shared_slug
      tags: ["Recipes"]
      summary: "Open shared recipe"
      description: "Auth: device."
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}}
