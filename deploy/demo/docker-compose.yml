# WeHum demo / staging server: the backend stack on one VPS. The host's nginx (shared with other sites) serves the CMS
# files and proxies to these containers, which listen on 127.0.0.1 only; certificates by certbot.
# Lives in /opt/wehum on the server; see deploy/demo/README.md. Secrets are in /opt/wehum/.env (never committed).
name: wehum
x-app: &app
  image: wehum-backend:latest
  build: { context: ./backend, dockerfile: docker/Dockerfile }
  env_file: [.env]
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    minio: { condition: service_started }
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: wehum, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: wehum }
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_min_duration_statement=200"]
    volumes: ["pg:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U wehum"], interval: 5s, retries: 20 }
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis:/data"]
    restart: unless-stopped
  minio:
    # the official image is no longer on Docker Hub; same image as local dev (docker-compose.yml)
    image: bitnamilegacy/minio:latest
    environment: { MINIO_ROOT_USER: "${S3_ACCESS_KEY}", MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY}", MINIO_DEFAULT_BUCKETS: "wehum-media:download" }
    volumes: ["minio:/bitnami/minio/data"]
    ports: ["127.0.0.1:9100:9000"]
    restart: unless-stopped
  api: { <<: *app, environment: { APP_ROLE: api, PORT: "3000" }, ports: ["127.0.0.1:3100:3000"] }
  worker: { <<: *app, environment: { APP_ROLE: worker } }
  scheduler: { <<: *app, environment: { APP_ROLE: scheduler } }
volumes: { pg: {}, redis: {}, minio: {} }
