# WeHum CMS (static build). Certificates are added by certbot (deploy.sh), like the other sites on this server.
server {
    listen 80;
    server_name __CMS_HOST__;
    root /opt/wehum/cms;
    index index.html;
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
