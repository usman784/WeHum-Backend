# WeHum storage (MinIO) for browser uploads and media: https://__API_HOST__:9443 → 127.0.0.1:9100.
# The Host header is kept so presigned URLs stay valid. Uses the api host's certificate.
server {
    listen 9443 ssl;
    server_name __API_HOST__;
    ssl_certificate /etc/letsencrypt/live/__API_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_HOST__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 200m;
    proxy_request_buffering off;
    location / {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }
}
