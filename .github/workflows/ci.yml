name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: wehum, POSTGRES_PASSWORD: wehum, POSTGRES_DB: wehum_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U wehum" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      minio:
        image: bitnamilegacy/minio:latest
        env: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345, MINIO_DEFAULT_BUCKETS: wehum-test }
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: cp .env.example .env && npm run keys
      - run: npm test
      - run: npm run build
